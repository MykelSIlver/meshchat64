# ================================================================
# MeshChat64 — OPTIONAL plain ws:// door for the C64
# ================================================================
# You only need this if your MeshChat relay is reachable ONLY via
# wss:// (TLS) and the C64 is remote. A 6502 cannot do TLS, so it
# needs a PLAIN ws:// entry point. This server block exposes one,
# bound to your LAN IP only (NOT 0.0.0.0), so the unencrypted door
# is never reachable from the internet. It proxies to the MeshChat
# relay backend — saint-cc/meshchat's server.py (default WS_PORT
# 8888) — NOT to anything in this repo.
#
# If the relay's plain-ws port (server.py :8888) is already
# reachable by the C64, skip this entirely and just dial the relay
# directly (see relay/SETUP.md).
#
# CONFIGURE:
#   1. Replace 192.168.1.100 with your Raspberry Pi's LAN IP.
#      This MUST match the ATDT dial target compiled into the C64
#      binary (see STR_ATDT in src/meshchat64.asm).
#   2. Point proxy_pass at wherever server.py's WS port lives
#      (default 127.0.0.1:8888).
#
# Drop this into /etc/nginx/sites-available/ (or your http{} block)
# and reload nginx.  See relay/SETUP.md for the full walkthrough.
# ================================================================

server {
    listen 192.168.1.100:8889;          # LAN IP only -> not reachable from the internet

    # Optional: separate logs for the C64 door
    access_log /var/log/nginx/meshchat_c64_access.log;
    error_log  /var/log/nginx/meshchat_c64_error.log;

    location / {                         # the C64 sends "GET / HTTP/1.1" (browsers use /ws/)
        proxy_pass http://127.0.0.1:8888;   # -> the MeshChat relay (saint-cc/meshchat server.py)

        proxy_http_version 1.1;             # REQUIRED for the WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;   # REQUIRED: pass the ws handshake through
        proxy_set_header Connection "upgrade";    # REQUIRED

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The C64 signs messages slowly (minutes on a stock 1 MHz machine);
        # generous timeouts keep nginx from dropping the connection mid-send.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600s;
    }
}
